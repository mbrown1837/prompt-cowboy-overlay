<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prompt Cowboy Settings</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #121214;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      padding: 20px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      justify-content: space-between;
      overflow: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 14px;
      border-bottom: 1px solid #27272a;
      -webkit-app-region: drag;
    }
    .header img {
      width: 24px;
      height: 24px;
      object-fit: contain;
      image-rendering: pixelated;
    }
    .header h2 {
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
    }
    .header .version {
      font-size: 11px;
      background: #27272a;
      color: #f97316;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: auto;
      font-weight: 600;
    }

    .content {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin: 14px 0;
      overflow-y: auto;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group label {
      font-size: 12px;
      font-weight: 500;
      color: #a1a1aa;
    }
    .form-group select {
      background: #18181b;
      border: 1px solid #3f3f46;
      color: #ffffff;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }
    .form-group select:focus {
      border-color: #f97316;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: #e4e4e7;
      cursor: pointer;
      padding: 2px 0;
    }
    .checkbox-row input {
      accent-color: #f97316;
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .action-row {
      display: flex;
      gap: 8px;
      margin-top: 2px;
    }
    .btn-secondary {
      background: #27272a;
      border: 1px solid #3f3f46;
      color: #d4d4d8;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      flex: 1;
      transition: background 0.15s, color 0.15s;
    }
    .btn-secondary:hover {
      background: #3f3f46;
      color: #ffffff;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 12px;
      border-top: 1px solid #27272a;
    }
    .btn-save {
      background: #f97316;
      border: none;
      color: #ffffff;
      padding: 8px 18px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-save:hover {
      background: #ea580c;
    }
    .btn-cancel {
      background: transparent;
      border: none;
      color: #a1a1aa;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-cancel:hover {
      color: #ffffff;
    }

    #update-status {
      font-size: 11px;
      text-align: center;
      min-height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-weight: 500;
    }
    .status-checking { color: #38bdf8; }
    .status-latest { color: #22c55e; }
    .status-available { color: #f97316; }
    .status-error { color: #ef4444; }
  </style>
</head>

    <h2>Prompt Cowboy Settings</h2>
    <span class="version" id="app-version">v1.2.1</span>
  </div>

  <div class="content">
    <div class="form-group">
      <label for="shortcut-select">Global Activation Shortcut:</label>
      <select id="shortcut-select">
        <option value="CommandOrControl+Shift+P">Ctrl + Shift + P (Default)</option>
        <option value="Alt+Space">Alt + Space (Spotlight style)</option>
        <option value="CommandOrControl+Space">Ctrl + Space</option>
        <option value="CommandOrControl+Shift+Space">Ctrl + Shift + Space</option>
        <option value="F1">F1</option>
        <option value="F4">F4</option>
        <option value="Alt+P">Alt + P</option>
      </select>
    </div>

    <div class="form-group">
      <label for="trigger-select">Inline Trigger Keyword (/cowboy):</label>
      <select id="trigger-select">
        <option value="/cowboy">/cowboy (Default)</option>
        <option value="/pc">/pc</option>
        <option value="/prompt">/prompt</option>
        <option value="/improve">/improve</option>
      </select>
    </div>

    <label class="checkbox-row">
      <input type="checkbox" id="autostart-checkbox" />
      <span>Launch automatically when Windows starts</span>
    </label>

    <div class="action-row">
      <button class="btn-secondary" id="btn-snap-corner">📌 Snap Corner</button>
      <button class="btn-secondary" id="btn-onboarding">📖 Quick Tour</button>
      <button class="btn-secondary" id="btn-check-updates">🔄 Updates</button>
    </div>
    <div id="update-status"></div>
  </div>

  <div class="footer">
    <button class="btn-cancel" id="btn-close">Cancel</button>
    <button class="btn-save" id="btn-save">Save</button>
  </div>

  <script>
    const shortcutSelect = document.getElementById('shortcut-select');
    const triggerSelect = document.getElementById('trigger-select');
    const autostartCheckbox = document.getElementById('autostart-checkbox');
    const btnSnapCorner = document.getElementById('btn-snap-corner');
    const btnOnboarding = document.getElementById('btn-onboarding');
    const btnCheckUpdates = document.getElementById('btn-check-updates');
    const btnClose = document.getElementById('btn-close');
    const btnSave = document.getElementById('btn-save');
    const updateStatus = document.getElementById('update-status');
    const appVersion = document.getElementById('app-version');

    window.electronAPI.getConfig().then(cfg => {
      if (cfg.shortcut) {
        shortcutSelect.value = cfg.shortcut;
      }
      if (cfg.inlineTrigger) {
        triggerSelect.value = cfg.inlineTrigger;
      }
      if (cfg.openAtLogin !== undefined) {
        autostartCheckbox.checked = cfg.openAtLogin;
      }
      if (cfg.version) {
        appVersion.textContent = 'v' + cfg.version;
      }
    });

    btnSnapCorner.onclick = () => {
      window.electronAPI.snapToCorner();
    };

    btnOnboarding.onclick = () => {
      window.electronAPI.openOnboarding();
      window.close();
    };

    btnCheckUpdates.onclick = async () => {
      updateStatus.className = 'status-checking';
      updateStatus.innerHTML = '<span>⏳</span> Checking for updates on GitHub...';
      btnCheckUpdates.disabled = true;

      try {
        const res = await window.electronAPI.checkUpdates();
        btnCheckUpdates.disabled = false;

        if (res.status === 'latest') {
          updateStatus.className = 'status-latest';
          updateStatus.innerHTML = `<span>✓</span> Latest version (${res.currentVersion || 'v1.2.0'}).`;
        } else if (res.status === 'update-available') {
          updateStatus.className = 'status-available';
          updateStatus.innerHTML = `<span>✨</span> Update ${res.latestVersion} available!`;
        } else {
          updateStatus.className = 'status-error';
          updateStatus.innerHTML = `<span>⚠️</span> ${res.error || 'Server unreachable.'}`;
        }
      } catch (err) {
        btnCheckUpdates.disabled = false;
        updateStatus.className = 'status-error';
        updateStatus.innerHTML = '<span>⚠️</span> Unable to check.';
      }
    };

    btnSave.onclick = async () => {
      const selectedShortcut = shortcutSelect.value;
      const selectedTrigger = triggerSelect.value;
      const enableAutostart = autostartCheckbox.checked;

      await window.electronAPI.setCustomShortcut(selectedShortcut);
      await window.electronAPI.toggleAutostart(enableAutostart);
      await window.electronAPI.saveConfig({
        shortcut: selectedShortcut,
        inlineTrigger: selectedTrigger,
        autostart: enableAutostart,
      });

      window.close();
    };

    btnClose.onclick = () => {
      window.close();
    };

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        window.close();
      }
    });
  </script>
</body>
</html>
