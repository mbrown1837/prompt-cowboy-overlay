<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prompt Cowboy Widget</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent !important;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    /* 1. FLOATING BUBBLE (Grammarly 32px Size) */
    #bubble-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent !important;
      cursor: grab;
    }
    #bubble-container:active {
      cursor: grabbing;
    }

    .bubble-inner {
      width: 32px;
      height: 32px;
      background: #09090b;
      border: 1.5px solid #f97316;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(249, 115, 22, 0.45);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      position: relative;
      cursor: pointer;
    }
    .bubble-inner:hover {
      transform: scale(1.12);
      box-shadow: 0 3px 12px rgba(249, 115, 22, 0.75);
    }
    .bubble-inner:active {
      transform: scale(0.95);
    }
    .bubble-inner img {
      width: 24px;
      height: 24px;
      object-fit: contain;
      pointer-events: none;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }

    /* 2. EXPANDED TOP HEADER */
    #panel-header {
      display: none;
      height: 42px;
      background: rgba(18, 18, 20, 0.98);
      border: 1px solid #27272a;
      border-bottom: 1px solid #3f3f46;
      border-top-left-radius: 14px;
      border-top-right-radius: 14px;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      -webkit-app-region: drag;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
      position: relative;
    }
    .panel-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #fafafa;
    }
    .panel-title img {
      width: 20px;
      height: 20px;
      object-fit: contain;
      image-rendering: crisp-edges;
    }
    .panel-title .badge {
      font-size: 10px;
      background: #27272a;
      color: #f97316;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 500;
      cursor: pointer;
      -webkit-app-region: no-drag;
      border: 1px solid transparent;
      transition: border-color 0.15s;
    }
    .panel-title .badge:hover {
      border-color: #f97316;
    }
    .panel-controls {
      display: flex;
      align-items: center;
      gap: 4px;
      -webkit-app-region: no-drag;
    }
    .btn-ctrl {
      background: transparent;
      border: none;
      color: #a1a1aa;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }
    .btn-ctrl:hover {
      background: #27272a;
      color: #fafafa;
    }

    /* Modern Settings Modal */
    #settings-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 999999;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
    }
    .modal-card {
      background: #18181b;
      border: 1px solid #3f3f46;
      border-radius: 14px;
      padding: 22px;
      width: 360px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      color: #f4f4f5;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8);
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-header h3 {
      font-size: 15px;
      font-weight: 600;
      color: #f97316;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group label {
      font-size: 12px;
      font-weight: 500;
      color: #e4e4e7;
    }
    .form-group select {
      background: #27272a;
      border: 1px solid #3f3f46;
      color: #fafafa;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #d4d4d8;
      cursor: pointer;
    }
    .checkbox-row input {
      accent-color: #f97316;
      cursor: pointer;
      width: 15px;
      height: 15px;
    }
    .modal-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
    }
    .btn-action {
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s;
    }
    .btn-action:hover {
      opacity: 0.9;
    }
    .btn-save {
      background: #f97316;
      color: #ffffff;
    }
    .btn-secondary {
      background: #27272a;
      color: #a1a1aa;
    }
  </style>
</head>
<body>

  <!-- 1. FLOATING BUBBLE -->
  <div id="bubble-container" title="Click to Open Prompt Cowboy (Drag to Reposition)">
    <div class="bubble-inner" id="bubble-click-target">
      <img src="./PC-pixel-icon.png" alt="Prompt Cowboy" />
    </div>
  </div>

  <!-- 2. EXPANDED TITLEBAR -->
  <div id="panel-header">
    <div class="panel-title">
      <img src="./PC-pixel-icon.png" alt="Prompt Cowboy" />
      <span>Prompt Cowboy</span>
      <span class="badge" id="settings-badge" title="Click to Open Settings">Settings ⚙</span>
    </div>
    <div class="panel-controls">
      <button class="btn-ctrl" id="btn-snap" title="Snap to Bottom-Right Corner">📌</button>
      <button class="btn-ctrl" id="btn-reload" title="Reload">⟳</button>
      <button class="btn-ctrl" id="btn-minimize" title="Collapse to Bubble (Esc)">─</button>
    </div>
  </div>

  <!-- APP SETTINGS MODAL -->
  <div id="settings-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>⚙ Prompt Cowboy Preferences</h3>
      </div>

      <div class="form-group">
        <label>Global Activation Shortcut:</label>
        <select id="shortcut-select">
          <option value="CommandOrControl+Shift+P">Ctrl + Shift + P (Default)</option>
          <option value="Alt+Space">Alt + Space</option>
          <option value="CommandOrControl+Space">Ctrl + Space</option>
          <option value="CommandOrControl+Shift+Space">Ctrl + Shift + Space</option>
          <option value="F1">F1</option>
          <option value="F4">F4</option>
          <option value="Alt+P">Alt + P</option>
        </select>
      </div>

      <label class="checkbox-row">
        <input type="checkbox" id="autostart-checkbox" />
        <span>Launch automatically when Windows starts</span>
      </label>

      <div class="modal-actions">
        <button class="btn-action btn-secondary" id="btn-check-updates">Check Updates</button>
        <div style="display:flex; gap:8px;">
          <button class="btn-action btn-secondary" id="modal-cancel">Close</button>
          <button class="btn-action btn-save" id="modal-save">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const bubbleContainer = document.getElementById('bubble-container');
    const panelHeader = document.getElementById('panel-header');
    const bubbleClickTarget = document.getElementById('bubble-click-target');

    const btnMinimize = document.getElementById('btn-minimize');
    const btnReload = document.getElementById('btn-reload');
    const btnSnap = document.getElementById('btn-snap');

    const settingsBadge = document.getElementById('settings-badge');
    const settingsModal = document.getElementById('settings-modal');
    const shortcutSelect = document.getElementById('shortcut-select');
    const autostartCheckbox = document.getElementById('autostart-checkbox');
    const btnCheckUpdates = document.getElementById('btn-check-updates');
    const modalCancel = document.getElementById('modal-cancel');
    const modalSave = document.getElementById('modal-save');

    // Load initial config
    window.electronAPI.getConfig().then(cfg => {
      if (cfg.shortcut) {
        shortcutSelect.value = cfg.shortcut;
      }
      if (cfg.openAtLogin !== undefined) {
        autostartCheckbox.checked = cfg.openAtLogin;
      }
    });

    function showBubble() {
      panelHeader.style.display = 'none';
      bubbleContainer.style.display = 'flex';
    }

    function showPanel() {
      bubbleContainer.style.display = 'none';
      panelHeader.style.display = 'flex';
    }

    // Smart Mouse Drag & Click Handler (Grammarly algorithm)
    let isDragging = false;
    let startX = 0;
    let startY = 0;
    let dragThreshold = 5;
    let totalMoved = 0;

    bubbleContainer.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      isDragging = true;
      startX = e.screenX;
      startY = e.screenY;
      totalMoved = 0;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dx = e.screenX - startX;
      const dy = e.screenY - startY;
      totalMoved += Math.abs(dx) + Math.abs(dy);

      startX = e.screenX;
      startY = e.screenY;

      window.electronAPI.moveBubble({ dx, dy });
    });

    window.addEventListener('mouseup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      if (totalMoved < dragThreshold) {
        window.electronAPI.expand();
      }
    });

    btnMinimize.addEventListener('click', () => {
      window.electronAPI.collapse();
    });

    btnReload.addEventListener('click', () => {
      window.electronAPI.reloadContent();
    });

    btnSnap.addEventListener('click', () => {
      window.electronAPI.snapToCorner();
    });

    settingsBadge.onclick = () => {
      settingsModal.style.display = 'flex';
    };

    modalCancel.onclick = () => {
      settingsModal.style.display = 'none';
    };

    btnCheckUpdates.onclick = async () => {
      await window.electronAPI.checkUpdates();
    };

    modalSave.onclick = async () => {
      const selectedShortcut = shortcutSelect.value;
      const enableAutostart = autostartCheckbox.checked;

      await window.electronAPI.setCustomShortcut(selectedShortcut);
      await window.electronAPI.toggleAutostart(enableAutostart);

      settingsModal.style.display = 'none';
    };

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (settingsModal.style.display === 'flex') {
          settingsModal.style.display = 'none';
        } else {
          window.electronAPI.collapse();
        }
      }
    });

    window.electronAPI.onStateChange((state) => {
      if (state === 'bubble') {
        showBubble();
      } else if (state === 'expanded') {
        showPanel();
      }
    });
  </script>
</body>
</html>
