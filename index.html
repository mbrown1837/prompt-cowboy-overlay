<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prompt Cowboy Widget</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent !important;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    /* 1. FLOATING HOVER BUBBLE (Compact, Clean, Zero Bounding Box) */
    #bubble-container {
      width: 48px;
      height: 48px;
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent !important;
      cursor: pointer;
      -webkit-app-region: drag;
    }
    .bubble-inner {
      width: 44px;
      height: 44px;
      background: #09090b;
      border: 1.5px solid #f97316;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 10px rgba(249, 115, 22, 0.45);
      transition: opacity 0.15s ease, box-shadow 0.15s ease;
      position: relative;
      overflow: hidden;
    }
    .bubble-inner:hover {
      box-shadow: 0 3px 14px rgba(249, 115, 22, 0.7);
      opacity: 0.95;
    }
    .bubble-inner img {
      width: 32px;
      height: 32px;
      object-fit: contain;
      pointer-events: none;
      image-rendering: pixelated;
    }

    /* 2. EXPANDED TOP HEADER */
    #panel-header {
      display: none;
      height: 42px;
      background: rgba(18, 18, 20, 0.98);
      border: 1px solid #27272a;
      border-bottom: 1px solid #3f3f46;
      border-top-left-radius: 14px;
      border-top-right-radius: 14px;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      -webkit-app-region: drag;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
      position: relative;
    }
    .panel-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #fafafa;
    }
    .panel-title img {
      width: 20px;
      height: 20px;
      object-fit: contain;
      image-rendering: pixelated;
    }
    .panel-title .badge {
      font-size: 10px;
      background: #27272a;
      color: #f97316;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 500;
      cursor: pointer;
      -webkit-app-region: no-drag;
      border: 1px solid transparent;
      transition: border-color 0.15s;
    }
    .panel-title .badge:hover {
      border-color: #f97316;
    }
    .panel-controls {
      display: flex;
      align-items: center;
      gap: 4px;
      -webkit-app-region: no-drag;
    }
    .btn-ctrl {
      background: transparent;
      border: none;
      color: #a1a1aa;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }
    .btn-ctrl:hover {
      background: #27272a;
      color: #fafafa;
    }

    /* Shortcut Modal */
    #shortcut-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 999999;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
    }
    .modal-card {
      background: #18181b;
      border: 1px solid #3f3f46;
      border-radius: 12px;
      padding: 20px;
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      color: #f4f4f5;
    }
    .modal-card h3 {
      font-size: 14px;
      font-weight: 600;
      color: #f97316;
    }
    .modal-card p {
      font-size: 12px;
      color: #a1a1aa;
      line-height: 1.4;
    }
    .modal-card select {
      background: #27272a;
      border: 1px solid #3f3f46;
      color: #fafafa;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
    }
    .modal-card .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .btn-action {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border: none;
    }
    .btn-save {
      background: #f97316;
      color: #ffffff;
    }
    .btn-cancel {
      background: #27272a;
      color: #a1a1aa;
    }
  </style>
</head>
<body>

  <!-- 1. FLOATING BUBBLE (Compact 44px Circle, Pure Clean Mascot) -->
  <div id="bubble-container" title="Click to Open Prompt Cowboy">
    <div class="bubble-inner" id="bubble-click-target">
      <img src="./PC-pixel-icon.png" alt="Prompt Cowboy Mascot" />
    </div>
  </div>

  <!-- 2. EXPANDED TITLEBAR -->
  <div id="panel-header">
    <div class="panel-title">
      <img src="./PC-pixel-icon.png" alt="Prompt Cowboy Mascot" />
      <span>Prompt Cowboy</span>
      <span class="badge" id="shortcut-badge" title="Click to Change Shortcut">Ctrl+Shift+P ⚙</span>
    </div>
    <div class="panel-controls">
      <button class="btn-ctrl" id="btn-snap" title="Snap to Bottom-Right Corner">📌</button>
      <button class="btn-ctrl" id="btn-reload" title="Reload">⟳</button>
      <button class="btn-ctrl" id="btn-minimize" title="Collapse to Bubble (Esc)">─</button>
    </div>
  </div>

  <!-- SHORTCUT SETTINGS MODAL -->
  <div id="shortcut-modal">
    <div class="modal-card">
      <h3>Change Global Shortcut</h3>
      <p>Select your preferred hotkey to instantly show or hide Prompt Cowboy anywhere:</p>
      <select id="shortcut-select">
        <option value="CommandOrControl+Shift+P">Ctrl + Shift + P (Default)</option>
        <option value="Alt+Space">Alt + Space</option>
        <option value="CommandOrControl+Space">Ctrl + Space</option>
        <option value="CommandOrControl+Shift+Space">Ctrl + Shift + Space</option>
        <option value="F1">F1</option>
        <option value="F4">F4</option>
        <option value="Alt+P">Alt + P</option>
      </select>
      <div class="modal-actions">
        <button class="btn-action btn-cancel" id="modal-cancel">Cancel</button>
        <button class="btn-action btn-save" id="modal-save">Save Shortcut</button>
      </div>
    </div>
  </div>

  <script>
    const bubbleContainer = document.getElementById('bubble-container');
    const panelHeader = document.getElementById('panel-header');
    const bubbleClickTarget = document.getElementById('bubble-click-target');

    const btnMinimize = document.getElementById('btn-minimize');
    const btnReload = document.getElementById('btn-reload');
    const btnSnap = document.getElementById('btn-snap');

    const shortcutBadge = document.getElementById('shortcut-badge');
    const shortcutModal = document.getElementById('shortcut-modal');
    const shortcutSelect = document.getElementById('shortcut-select');
    const modalCancel = document.getElementById('modal-cancel');
    const modalSave = document.getElementById('modal-save');

    // Load initial config
    window.electronAPI.getConfig().then(cfg => {
      if (cfg.shortcut) {
        shortcutSelect.value = cfg.shortcut;
        shortcutBadge.textContent = cfg.shortcut.replace('CommandOrControl', 'Ctrl') + ' ⚙';
      }
    });

    function showBubble() {
      panelHeader.style.display = 'none';
      bubbleContainer.style.display = 'flex';
    }

    function showPanel() {
      bubbleContainer.style.display = 'none';
      panelHeader.style.display = 'flex';
    }

    bubbleClickTarget.onclick = (e) => {
      window.electronAPI.expand();
    };

    btnMinimize.onclick = () => {
      window.electronAPI.collapse();
    };

    btnReload.onclick = () => {
      window.electronAPI.reloadContent();
    };

    btnSnap.onclick = () => {
      window.electronAPI.snapToCorner();
    };

    // Shortcut modal logic
    shortcutBadge.onclick = () => {
      shortcutModal.style.display = 'flex';
    };

    modalCancel.onclick = () => {
      shortcutModal.style.display = 'none';
    };

    modalSave.onclick = async () => {
      const selected = shortcutSelect.value;
      const res = await window.electronAPI.setCustomShortcut(selected);
      if (res.success) {
        shortcutBadge.textContent = selected.replace('CommandOrControl', 'Ctrl') + ' ⚙';
        shortcutModal.style.display = 'none';
      } else {
        alert('Could not register shortcut. It may be in use by another app.');
      }
    };

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (shortcutModal.style.display === 'flex') {
          shortcutModal.style.display = 'none';
        } else {
          window.electronAPI.collapse();
        }
      }
    });

    window.electronAPI.onStateChange((state) => {
      if (state === 'bubble') {
        showBubble();
      } else if (state === 'expanded') {
        showPanel();
      }
    });
  </script>
</body>
</html>
