<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prompt Cowboy Widget</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent !important;
      overflow: hidden !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    /* 1. FLOATING BUBBLE (Grammarly 32px Round Mascot Badge) */
    #bubble-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent !important;
      cursor: grab;
      overflow: hidden !important;
    }
    #bubble-container:active {
      cursor: grabbing;
    }

    .bubble-inner {
      width: 32px;
      height: 32px;
      background: #09090b;
      border: 1.5px solid #f97316;
      border-radius: 50% !important;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(249, 115, 22, 0.45);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      position: relative;
      overflow: hidden !important;
      cursor: pointer;
    }
    .bubble-inner:hover {
      transform: scale(1.1);
      box-shadow: 0 3px 12px rgba(249, 115, 22, 0.75);
    }
    .bubble-inner:active {
      transform: scale(0.95);
    }
    .bubble-inner img {
      width: 24px;
      height: 24px;
      object-fit: contain;
      pointer-events: none;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }

    /* 2. EXPANDED TOP HEADER */
    #panel-header {
      display: none;
      height: 42px;
      background: rgba(18, 18, 20, 0.98);
      border: 1px solid #27272a;
      border-bottom: 1px solid #3f3f46;
      border-top-left-radius: 14px;
      border-top-right-radius: 14px;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      -webkit-app-region: drag;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
      position: relative;
    }
    .panel-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #fafafa;
    }
    .panel-title img {
      width: 20px;
      height: 20px;
      object-fit: contain;
      image-rendering: crisp-edges;
    }
    .panel-title .badge {
      font-size: 11px;
      background: #27272a;
      color: #f97316;
      padding: 3px 8px;
      border-radius: 5px;
      font-weight: 500;
      cursor: pointer;
      -webkit-app-region: no-drag;
      border: 1px solid #3f3f46;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .panel-title .badge:hover {
      border-color: #f97316;
      background: #3f3f46;
      color: #ffffff;
    }
    .panel-controls {
      display: flex;
      align-items: center;
      gap: 4px;
      -webkit-app-region: no-drag;
    }
    .btn-ctrl {
      background: transparent;
      border: none;
      color: #a1a1aa;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }
    .btn-ctrl:hover {
      background: #27272a;
      color: #fafafa;
    }
  </style>
</head>
<body>

  <!-- 1. FLOATING BUBBLE (Grammarly 32px Round Mascot Badge) -->
  <div id="bubble-container" title="Click to Open Prompt Cowboy (Drag to Reposition)">
    <div class="bubble-inner" id="bubble-click-target">
      <img src="./PC-pixel-icon.png" alt="Prompt Cowboy" />
    </div>
  </div>

  <!-- 2. EXPANDED TITLEBAR -->
  <div id="panel-header">
    <div class="panel-title">
      <img src="./PC-pixel-icon.png" alt="Prompt Cowboy" />
      <span>Prompt Cowboy</span>
      <span class="badge" id="settings-badge" title="Open Settings Window">Settings ⚙</span>
    </div>
    <div class="panel-controls">
      <button class="btn-ctrl" id="btn-snap" title="Snap to Bottom-Right Corner">📌</button>
      <button class="btn-ctrl" id="btn-reload" title="Reload">⟳</button>
      <button class="btn-ctrl" id="btn-minimize" title="Collapse to Bubble (Esc)">─</button>
    </div>
  </div>

  <script>
    const bubbleContainer = document.getElementById('bubble-container');
    const panelHeader = document.getElementById('panel-header');
    const bubbleClickTarget = document.getElementById('bubble-click-target');

    const btnMinimize = document.getElementById('btn-minimize');
    const btnReload = document.getElementById('btn-reload');
    const btnSnap = document.getElementById('btn-snap');
    const settingsBadge = document.getElementById('settings-badge');

    function showBubble() {
      panelHeader.style.display = 'none';
      bubbleContainer.style.display = 'flex';
    }

    function showPanel() {
      bubbleContainer.style.display = 'none';
      panelHeader.style.display = 'flex';
    }

    // Smart Mouse Drag & Click Handler
    let isDragging = false;
    let startX = 0;
    let startY = 0;
    let dragThreshold = 5;
    let totalMoved = 0;

    bubbleContainer.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      isDragging = true;
      startX = e.screenX;
      startY = e.screenY;
      totalMoved = 0;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dx = e.screenX - startX;
      const dy = e.screenY - startY;
      totalMoved += Math.abs(dx) + Math.abs(dy);

      startX = e.screenX;
      startY = e.screenY;

      window.electronAPI.moveBubble({ dx, dy });
    });

    window.addEventListener('mouseup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      if (totalMoved < dragThreshold) {
        window.electronAPI.expand();
      }
    });

    btnMinimize.addEventListener('click', () => {
      window.electronAPI.collapse();
    });

    btnReload.addEventListener('click', () => {
      window.electronAPI.reloadContent();
    });

    btnSnap.addEventListener('click', () => {
      window.electronAPI.snapToCorner();
    });

    settingsBadge.addEventListener('click', () => {
      window.electronAPI.openSettings();
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        window.electronAPI.collapse();
      }
    });

    window.electronAPI.onStateChange((state) => {
      if (state === 'bubble') {
        showBubble();
      } else if (state === 'expanded') {
        showPanel();
      }
    });
  </script>
</body>
</html>
